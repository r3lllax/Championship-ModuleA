<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/authorization.css">
    <title>BestGames - Вход в аккаунт</title>
</head>
<body>
    <header>
        <div class="header-logo">
            <img src="/images/BestGamesLogo.png" alt="BestGames">
        </div>
        <div class="header-user">
            <a href="#" class="header-user_profile">
                <img src="" alt="Профиль">
            </a>
            <button class="button success">Войти</button>
        </div>
    </header>
    <div class="main">
        <div class="content">
            <div class="authorization">
                <form class="form">
                    <div class="form-label">
                        Вход в аккаунт
                    </div>
                    <div class="form-email">
                        <span>E-mail</span>
                        <input type="text" class="input" placeholder="example@email.com">
                    </div>
                    <div class="form-password">
                        <span>Пароль</span>
                        <input type="password" class="input" placeholder="********">
                    </div>
                    <div class="form-buttons">
                        <button class="button primary-button">Войти</button>
                        <a>Восстановить пароль</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer-top">
            <div>8-800-999-55-99</div>
            <div>best@games.ru</div>
            <div>Клиентам</div>
            <div>Партнерам</div>
            <div>О нас</div>
            <div>Контакты</div>
        </div>
        <div class="footer-bottom">
            <div>Главная</div>
            <div>Авторизация</div>
            <div>Регистрация</div>
            <div>Поиск</div>
        </div>
    </footer>
</body>
</html>
