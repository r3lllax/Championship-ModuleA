<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/general.css">
    <title>BestGames - Главная</title>
</head>
<body>
    <header>
        <div class="header-logo">
            <img src="" alt="BestGames">
        </div>
        <nav class="header-buttons">
            <button class="href-button header-buttons_search header-buttons_active">Поиск</button>
            <button class="href-button">Каталог&nbsp;игр</button>
            <button class="href-button">Личный&nbsp;кабинет</button>
        </nav>
        <div class="header-user">
            <a href="#" class="header-user_profile">
                <img src="" alt="Профиль">
            </a>
            <button class="button success">Войти</button>
        </div>
    </header>
    <div class="main">
        <div class="content">
            <div class="slider">
                слайдер
            </div>
            <div class="search">
                <div class="search-wrap">
                    <div class="search-lens">
                        <img src="/images/search.svg" alt="">
                    </div>
                    <div class="search-input">
                        <input 
                            class="input" 
                            placeholder="Поиск по жанру игры" 
                            type="text"
                        />
                    </div>
                </div>
                <div class="search-button">
                        <button class="button search-button_button">Найти</button>
                </div>
            </div>
            <div class="advantages">
                достоинства
            </div>
            <div class="popular-games">
                популярные игры
            </div>
        </div>
    </div>
    <footer></footer>
</body>
</html>
