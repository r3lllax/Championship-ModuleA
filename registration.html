<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/registration.css">
    <title>BestGames - Регистрация</title>
</head>
<body>
    <header>
        <div class="header-logo">
            <a href="/index.html">
                <img src="/images/BestGamesLogo.png" alt="BestGames">
            </a>
        </div>
        <div class="header-user">
            <button class="button success">Войти</button>
        </div>
    </header>
    <div class="main">
        <div class="content">
            <div class="registration">
                <form class="form">
                    <div class="form-label">
                        Регистрация
                    </div>
                    <div class="form-field form-email">
                        <span>E-mail</span>
                        <input name="email" type="text" class="input" placeholder="example@email.com">
                    </div>
                    <div class="form-field form-lastname">
                        <span>Фамилия</span>
                        <input name="lastname" type="text" class="input" placeholder="Иванов">
                    </div>
                    <div class="form-field form-name">
                        <span>Иван</span>
                        <input name="firstname" type="text" class="input" placeholder="Иван">
                    </div>
                    <div class="form-field form-birthdate">
                        <span>Дата рождения</span>
                        <input name="birthdate" type="date" class="input">
                    </div>
                    <div class="form-field form-phone">
                        <span>Номер телефона</span>
                        <input name="phone" type="text" class="input" placeholder="+79001234567">
                    </div>
                    <div class="form-field form-password">
                        <span>Пароль</span>
                        <input name="password" type="password" class="input" placeholder="********">
                    </div>
                    <div class="form-field form-password-confirm">
                        <span>Подтвердите пароль</span>
                        <input name="passwordconfirm" type="password" class="input" placeholder="********">
                    </div>
                    <div class="form-user-processing">
                        <input name="data-processing" type="checkbox" class="input" checked>
                        <span>Я согласен на обработку персональных данных</span>
                    </div>
                    <div class="form-buttons">
                        <button class="button primary-button">Зарегистрироваться</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <footer>
        <div class="footer-top">
            <div>8-800-999-55-99</div>
            <div>best@games.ru</div>
            <div>Клиентам</div>
            <div>Партнерам</div>
            <div>О нас</div>
            <div>Контакты</div>
        </div>
        <div class="footer-bottom">
            <div><a href="/index.html">Главная</a></div>
            <div><a href="/authorization.html">Авторизация</a></div>
            <div><a href="/registration.html">Регистрация</a></div>
            <div><a href="/index.html#search">Поиск</a></div>
        </div>
    </footer>
</body>
</html>
