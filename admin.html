        <div class="header-burger">

        </header>

    <div class="main">
        <div class="content">
           <div class="form-label">
                <span>Добавить игру</span>
            </div>
           <form class="form">
                <div class="form-top">
                    <div class="form-field">
                        <span>Название</span>
                        <input type="text" class="input" placeholder="">
                    </div>
                </div>
                <div class="form-bottom">
                    <div class="form-left">
                        <div class="form-field">
                            <span>Жанр</span>
                            <select class="input">
                                <option>Экшен</option>
                                <option>РПГ</option>
                                <option>Шутер</option>
                                <option>Приключения</option>
                                <option>Стратегии</option>
                                <option>Хоррор</option>
                                <option>Гонки</option>
                                <option>Спорт</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <span>Изображение</span>
                            <div class="input-image">
                                <svg class="input-image_image" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cloud-arrow-up" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M7.646 5.146a.5.5 0 0 1 .708 0l2 2a.5.5 0 0 1-.708.708L8.5 6.707V10.5a.5.5 0 0 1-1 0V6.707L6.354 7.854a.5.5 0 1 1-.708-.708z"/>
  <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383m.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z"/>
</svg>
                                <input id="file-upload" type="file" accept="image/*">
                                <label for="file-upload">Загрузить изображение</label>
                                <span>Форматы: JPG, PNG</span>
                            </div>
                        </div>
                        <div class="form-field company">
                            <span>Компания-разработчик</span>
                            <input type="text" class="input" placeholder="">
                        </div>
                        <div class="cost">
                            <span>Стоимость</span>
                            <div class="input-money">
                                <span>Р</span>
                                <input type="text" class="input" placeholder="">
                            </div>
                        </div>
                    </div>
                    <div class="form-right">
                        <div class="form-field description">
                            <span>Описание</span>
                            <input type="text" class="input" placeholder="">
                        </div>
                    </div>
                </div>
                <div class="form-buttons">
                    <button class="button primary-button">Добавить</button>
                </div>
           </form>
        </div>
    </div>
    <footer>
        <div class="footer-top">
            <div>8-800-999-55-99</div>
            <div>best@games.ru</div>
            <div>Клиентам</div>
            <div>Партнерам</div>
            <div>О нас</div>
            <div>Контакты</div>
        </div>
        <div class="footer-bottom">
